<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <div class="calculator">
        <div class="result-div d-flex flex-row justify-content-center align-items-center">
            <div class="result d-flex flex-column justify-content-end align-items-end">0</div>
        </div>
        <div class="buttondiv d-flex flex-column justify-content-evenly">
            <div class="d-flex justify-content-evenly rows">
                <button type="button" class="btn btn-success btns">&plus;</button>
                <button type="button" class="btn btn-success btns">&minus;</button>
                <button type="button" class="btn btn-success btns">&times;</button>
                <button type="button" class="btn btn-success btns">&divide;</button>
                <button type="button" class="btn btn-danger btns"><i class="fa-solid fa-delete-left"></i></button>
            </div>
            <div class="d-flex justify-content-evenly rows">
                <button type="button" class="btn btn-info btns">e</button>
                <button type="button" class="btn btn-info btns">7</button>
                <button type="button" class="btn btn-info btns">8</button>
                <button type="button" class="btn btn-info btns">9</button>
                <button type="button" class="btn btn-danger btns">C</button>
            </div>
            <div class="d-flex justify-content-evenly rows">
                <button type="button" class="btn btn-info btns">n!</button>
                <button type="button" class="btn btn-info btns">4</button>
                <button type="button" class="btn btn-info btns">5</button>
                <button type="button" class="btn btn-info btns">6</button>
                <button type="button" class="btn btn-info btns">ln</button>
            </div>
            <div class="d-flex justify-content-evenly rows">
                <button type="button" class="btn btn-info btns">&lpar;</button>
                <button type="button" class="btn btn-info btns">1</button>
                <button type="button" class="btn btn-info btns">2</button>
                <button type="button" class="btn btn-info btns">3</button>
                <button type="button" class="btn btn-info btns">x<sup>y</sup></button>
            </div>
            <div class="d-flex justify-content-evenly rows">
                <button type="button" class="btn btn-info btns">&rpar;</button>
                <button type="button" class="btn btn-info btns">&pi;</button>
                <button type="button" class="btn btn-info btns">0</button>
                <button type="button" class="btn btn-info btns">.</button>
                <button type="button" class="btn btn-info btns">=</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
